<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial 6-Axis Robot Arm Simulation</title>
  <link rel="stylesheet" href="style.css">
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="light-theme">

  <!-- แผงควบคุมด้านซ้าย -->
  <div id="dashboard">
    <div class="header">
      <h2>แผงควบคุมแขนกลอุตสาหกรรม</h2>
      <p>ปรับตั้งองศาข้อต่อ J1 - J6 (สีส้มอุตสาหกรรม)</p>
    </div>
    
    <!-- J1 -->
    <div class="control-card">
      <div class="control-header">
        <label>J1 (Base Rotate)</label>
        <div class="input-box-wrapper">
          <input type="number" id="j1-num" min="-180" max="180" value="0">
          <span class="unit">°</span>
        </div>
      </div>
      <input type="range" id="j1" min="-180" max="180" value="0">
    </div>

    <!-- J2 -->
    <div class="control-card">
      <div class="control-header">
        <label>J2 (Shoulder Pitch)</label>
        <div class="input-box-wrapper">
          <input type="number" id="j2-num" min="-180" max="180" value="0">
          <span class="unit">°</span>
        </div>
      </div>
      <input type="range" id="j2" min="-180" max="180" value="0">
    </div>

    <!-- J3 -->
    <div class="control-card">
      <div class="control-header">
        <label>J3 (Elbow Pitch)</label>
        <div class="input-box-wrapper">
          <input type="number" id="j3-num" min="-180" max="180" value="0">
          <span class="unit">°</span>
        </div>
      </div>
      <input type="range" id="j3" min="-180" max="180" value="0">
    </div>

    <!-- J4 -->
    <div class="control-card">
      <div class="control-header">
        <label>J4 (Forearm Roll)</label>
        <div class="input-box-wrapper">
          <input type="number" id="j4-num" min="-180" max="180" value="0">
          <span class="unit">°</span>
        </div>
      </div>
      <input type="range" id="j4" min="-180" max="180" value="0">
    </div>

    <!-- J5 -->
    <div class="control-card">
      <div class="control-header">
        <label>J5 (Wrist Pitch)</label>
        <div class="input-box-wrapper">
          <input type="number" id="j5-num" min="-180" max="180" value="0">
          <span class="unit">°</span>
        </div>
      </div>
      <input type="range" id="j5" min="-180" max="180" value="0">
    </div>

    <!-- J6 -->
    <div class="control-card">
      <div class="control-header">
        <label>J6 (Tool/Gripper Roll)</label>
        <div class="input-box-wrapper">
          <input type="number" id="j6-num" min="-180" max="180" value="0">
          <span class="unit">°</span>
        </div>
      </div>
      <input type="range" id="j6" min="-180" max="180" value="0">
    </div>

    <button id="reset-btn">รีเซ็ตตำแหน่ง (0° ทั้งหมด)</button>
  </div>

  <!-- พื้นที่แสดงผล 3D ด้านขวา -->
  <div id="canvas-container"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
